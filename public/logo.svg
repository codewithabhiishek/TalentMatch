<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tfLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tfLogoBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="tfLogoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular background matching circular favicon -->
  <circle cx="60" cy="60" r="56" fill="url(#tfLogoBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" filter="url(#tfLogoShadow)" />

  <!-- Candidate talent silhouette -->
  <circle cx="60" cy="42" r="16" fill="#ffffff" />
  <path d="M30 90 C30 74 43 65 60 65 C77 65 90 74 90 90" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

  <!-- Verification match badge -->
  <circle cx="85" cy="81" r="17" fill="url(#tfLogoBadge)" stroke="#0f172a" stroke-width="3" />
  <path d="M78.5 81 L83 85.5 L91.5 76" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
