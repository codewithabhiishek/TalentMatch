<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="tmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="tmBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Clinical Medical Cross Gradient -->
    <linearGradient id="tmCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="12" fill="url(#tmBgGrad)" stroke="url(#tmBorderGrad)" stroke-width="1.5"/>

  <!-- Soft Radial Ambient Glow -->
  <circle cx="24" cy="24" r="14" fill="#0ea5e9" opacity="0.12" filter="url(#tmGlow)"/>

  <!-- Clinical Medical Cross (+) -->
  <!-- Vertical Arm -->
  <rect x="19.5" y="9.5" width="9" height="29" rx="4.5" fill="url(#tmCrossGrad)"/>
  <!-- Horizontal Arm -->
  <rect x="9.5" y="19.5" width="29" height="9" rx="4.5" fill="url(#tmCrossGrad)"/>

  <!-- The Vital ECG Heartbeat Waveform cutting through the cross -->
  <path d="M 11.5 24 H 17 L 19.5 26.5 L 23 14 L 26.5 34 L 28.5 22 L 30 24 H 36.5" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#tmGlow)"/>

  <!-- Precision Match Focal Core -->
  <circle cx="23" cy="14" r="1.8" fill="#38bdf8"/>
  <circle cx="23" cy="14" r="0.9" fill="#ffffff"/>
</svg>
