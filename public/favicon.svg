<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="tmFavBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1426"/>
      <stop offset="1" stop-color="#02050e"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="tmFavBorder" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Vertical Ribbon Loop (Clinical Talent) -->
    <linearGradient id="tmFavV" x1="24" y1="9" x2="24" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.6" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Horizontal Ribbon Loop (Healthcare Opportunity) -->
    <linearGradient id="tmFavH" x1="9" y1="24" x2="39" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tmFavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tmFavBg)" stroke="url(#tmFavBorder)" stroke-width="1.8"/>

  <!-- Core Ambient Glow -->
  <circle cx="24" cy="24" r="12" fill="#0ea5e9" opacity="0.18" filter="url(#tmFavGlow)"/>

  <!-- Vertical Ribbon Loop (Talent) -->
  <path d="M19 14.5C19 11.74 21.24 9.5 24 9.5C26.76 9.5 29 11.74 29 14.5V33.5C29 36.26 26.76 38.5 24 38.5C21.24 38.5 19 36.26 19 33.5V14.5Z" 
        stroke="url(#tmFavV)" stroke-width="5" stroke-linecap="round"/>

  <!-- Horizontal Ribbon Loop (Opportunity) -->
  <path d="M14.5 19C11.74 19 9.5 21.24 9.5 24C9.5 26.76 11.74 29 14.5 29H33.5C36.26 29 38.5 26.76 38.5 24C38.5 21.24 36.26 19 33.5 19H14.5Z" 
        stroke="url(#tmFavH)" stroke-width="5" stroke-linecap="round"/>

  <!-- Depth Occlusion (Weave Overlap) -->
  <path d="M19 21.25V26.75" stroke="#040711" stroke-width="7" stroke-linecap="butt"/>
  <path d="M19 21.25V26.75" stroke="url(#tmFavV)" stroke-width="5" stroke-linecap="round"/>

  <path d="M29 21.25V26.75" stroke="#040711" stroke-width="7" stroke-linecap="butt"/>
  <path d="M29 21.25V26.75" stroke="url(#tmFavV)" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Radiant Match Precision Star -->
  <path d="M24 19.5L25.4 22.6L28.5 24L25.4 25.4L24 28.5L22.6 25.4L19.5 24L22.6 22.6L24 19.5Z" fill="#ffffff" filter="url(#tmFavGlow)"/>
  <circle cx="24" cy="24" r="1.6" fill="#38bdf8"/>
</svg>
